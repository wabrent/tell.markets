<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare tokens — Tell</title>
<meta name="description" content="Put two Robinhood Chain tokens side by side: contract, holders, deployer, website and market.">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/assets/tell.js"></script>
<style>
:root {
  --ink: #0b0b0c; --ink-2: #121213; --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.14);
  --text: #ece9e2; --muted: #9a958d; --dim: #5f5b55; --red: #8e0c14; --red-deep: #5c070c;
  --green: #4fb27a; --amber: #e3a540; --bad: #ff5a5f; --mid: #d8c24a;
  --serif: 'Instrument Serif', 'Times New Roman', serif;
  --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ink); }
body { background: var(--ink); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 768px) { .wrap { padding: 0 40px; } }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.band { position: relative; overflow: hidden; padding-bottom: 40px;
  background: radial-gradient(70% 140% at 85% 0%, rgba(255,40,40,0.22), transparent 60%), linear-gradient(120deg, var(--red-deep), var(--red) 60%, #7a0a12); }
.band::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .2; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.band > * { position: relative; z-index: 1; }
nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 12px; }
.brand { font-family: var(--serif); font-size: 22px; letter-spacing: .32em; display: inline-flex; align-items: center; gap: 12px; color: #fff; }
.logo { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.links { display: none; gap: 26px; font-size: 13px; color: rgba(255,255,255,.85); }
.links a.on { color: #fff; text-decoration: underline; text-underline-offset: 6px; }
@media (min-width: 900px) { .links { display: flex; } }
.band h1 { font-family: var(--serif); font-weight: 400; font-size: 52px; line-height: .95; color: #fff; margin-top: 16px; }
@media (min-width: 768px) { .band h1 { font-size: 80px; } }
.band .label { color: rgba(255,255,255,.75); }
form { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 10px; align-items: center; margin-top: 28px; max-width: 980px; }
@media (max-width: 760px) { form { grid-template-columns: 1fr; } form .vs { display: none; } }
form input { min-width: 0; background: rgba(10,4,5,.45); border: 1px solid rgba(255,255,255,.2); color: #fff; border-radius: 9999px; padding: 12px 18px; font: 13px var(--mono); outline: none; backdrop-filter: blur(6px); }
form input::placeholder { color: rgba(255,255,255,.5); }
form input:focus { border-color: rgba(255,255,255,.6); }
.vs { font-family: var(--serif); font-style: italic; font-size: 28px; color: #fff; }
.btn { border: 0; border-radius: 9999px; padding: 12px 22px; background: var(--text); color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.btn:disabled { opacity: .8; cursor: progress; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(11,11,12,.25); border-top-color: var(--ink); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.err { color: #ffd3d4; margin-top: 12px; }

main { padding: 32px 0 80px; }
.progress { height: 2px; position: relative; overflow: hidden; margin-bottom: 24px; opacity: 0; transition: opacity .3s; }
.progress.on { opacity: 1; }
.progress::before { content: ""; position: absolute; top: 0; left: -35%; width: 35%; height: 100%; background: linear-gradient(90deg, transparent, var(--bad), transparent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { to { left: 100%; } }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.card { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: linear-gradient(160deg, rgba(255,255,255,0.025), transparent); position: relative; overflow: hidden;
  animation: up .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
@keyframes up { from { opacity: 0; transform: translateY(14px); } }
.card.win { border-color: rgba(79,178,122,.45); box-shadow: 0 0 40px -18px rgba(79,178,122,.7); }
.win-tag { position: absolute; top: 16px; right: 16px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--green); border: 1px solid rgba(79,178,122,.5); border-radius: 9999px; padding: 3px 9px; }
.tk { display: flex; gap: 12px; align-items: center; }
.ava { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #d6e4f6, #1e4e6c); overflow: hidden; flex: none; }
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tk b { font-weight: 500; font-size: 17px; display: block; }
.tk span { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.big { display: flex; align-items: baseline; gap: 10px; margin-top: 18px; }
.big b { font-family: var(--serif); font-weight: 400; font-size: 88px; line-height: .85; }
.big span { color: var(--dim); font-size: 13px; }
.t-ok { --c: var(--green); } .t-mid { --c: var(--mid); } .t-warn { --c: var(--amber); } .t-bad { --c: var(--bad); }
.meter { height: 3px; margin-top: 14px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--c); transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
.tag { display: inline-block; margin-top: 12px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 9999px; padding: 2px 10px; }
.verdict { font-family: var(--serif); font-size: 21px; line-height: 1.2; margin-top: 16px; }
.spark-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--dim); font-size: 12px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 18px; }
.facts div { background: var(--ink); padding: 10px 12px; }
.facts b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; }
.facts .label { font-size: 9.5px; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 40px; margin: 48px 0 16px; }
.grp { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; animation: up .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
.grp-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.grp-h .who { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.grp-h .who b { color: var(--green); font-weight: 400; }
.grp-b { display: grid; grid-template-columns: 1fr 1fr; }
.grp-b > div { padding: 8px 16px 12px; }
.grp-b > div + div { border-left: 1px solid var(--line); }
@media (max-width: 760px) { .grp-b { grid-template-columns: 1fr; } .grp-b > div + div { border-left: 0; border-top: 1px solid var(--line); } }
.row { display: flex; gap: 10px; padding: 6px 0; font-size: 13.5px; }
.row small { display: block; color: var(--dim); font-size: 11.5px; }
.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; }
.ok { background: var(--green); } .warn { background: var(--amber); } .bad { background: var(--bad); } .info { background: var(--dim); }
.none { color: var(--dim); font-size: 13px; padding: 6px 0; }
.share { margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.share a, .share button { border: 1px solid var(--line-2); border-radius: 9999px; padding: 7px 14px; font-size: 13px; background: none; cursor: pointer; }
.share a:hover, .share button:hover { border-color: var(--text); }
.hint { color: var(--muted); }
footer { padding: 32px 0 48px; border-top: 1px solid var(--line); font-size: 13px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="band">
  <nav>
    <div class="wrap">
      <a class="brand" href="/"><img class="logo" src="/assets/logo.webp" alt="" width="34" height="34">TELL</a>
      <div class="links"><a href="/">Check</a><a href="/launches">Launches</a><a href="/compare" class="on">Compare</a><a href="/app">Token map</a></div>
      <div data-wallet></div>
    </div>
  </nav>
  <div class="wrap">
    <span class="label">Side by side</span>
    <h1>Which tell is <em>louder?</em></h1>
    <form id="form">
      <input id="a" placeholder="First token 0x…" spellcheck="false" autocomplete="off">
      <span class="vs">vs</span>
      <input id="b" placeholder="Second token 0x…" spellcheck="false" autocomplete="off">
      <button class="btn" type="submit" id="go">Compare →</button>
    </form>
    <p class="err" id="err" hidden></p>
  </div>
</header>

<main class="wrap">
  <div class="progress" id="progress"></div>
  <div id="out"><p class="hint">Paste two token addresses or DexScreener links. Each check takes 10–30 seconds; both run at the same time.</p></div>
</main>
<footer><div class="wrap">Not financial advice. A lower score means fewer red flags found, not a safe investment.</div></footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const usd = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? '$' + (n / 1e3).toFixed(1) + 'k' : '$' + Math.round(n);
const tone = v => v >= 80 ? 'bad' : v >= 60 ? 'warn' : v >= 30 ? 'mid' : 'ok';
const GROUPS = [['contract', 'Contract'], ['holders', 'Holders'], ['deployer', 'Deployer'], ['website', 'Website & socials'], ['market', 'Market']];
const RANK = { bad: 3, warn: 2, info: 0, ok: 0 };

$('form').addEventListener('submit', e => { e.preventDefault(); run($('a').value.trim(), $('b').value.trim()); });

async function run(a, b) {
  if (!a || !b) { (a ? $('b') : $('a')).focus(); return; }
  $('err').hidden = true;
  $('go').disabled = true; $('go').innerHTML = '<span class="spin"></span>Checking both…';
  $('progress').classList.add('on');
  try {
    const [ra, rb] = await Promise.all([a, b].map(async q => {
      const res = await fetch('/api/check?q=' + encodeURIComponent(q));
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Check failed');
      return d;
    }));
    history.replaceState(null, '', `/compare?a=${ra.token.address}&b=${rb.token.address}`);
    render(ra, rb);
  } catch (err) {
    $('err').textContent = err.message; $('err').hidden = false;
  } finally {
    $('go').disabled = false; $('go').innerHTML = 'Compare →';
    $('progress').classList.remove('on');
  }
}

function card(r, win, i) {
  const pair = r.pairs[0];
  const img = r.meta?.image || pair?.info?.imageUrl;
  const t = tone(r.score.value);
  const hrs = pair?.pairCreatedAt ? (Date.now() - pair.pairCreatedAt) / 36e5 : null;
  return `<div class="card t-${t}${win ? ' win' : ''}" style="--d:${i * 0.08}s">
    ${win ? '<span class="win-tag">Fewer red flags</span>' : ''}
    <div class="tk"><div class="ava">${img ? `<img src="${esc(img)}" alt="" onerror="this.remove()">` : ''}</div>
      <div><b>${esc(r.token.symbol ? '$' + r.token.symbol : short(r.token.address))}</b><span>${esc(r.token.name || '')} · ${short(r.token.address)}</span></div></div>
    <div class="big"><b data-to="${r.score.value}">0</b><span>/ 100 risk</span></div>
    <div class="meter"><i data-w="${Math.max(r.score.value, 3)}"></i></div>
    <span class="tag">${esc(r.score.label)}</span>
    <div class="verdict">${esc(r.verdict)}</div>
    ${r.history?.length > 1 ? `<div class="spark-row">${Tell.sparkline(r.history, 140, 30)}<span>risk over time</span></div>` : ''}
    <div class="facts">
      <div><span class="label">Holders</span><b>${r.facts?.holders?.toLocaleString('en-US') ?? '—'}</b></div>
      <div><span class="label">Liquidity</span><b>${pair?.liquidity?.usd ? usd(pair.liquidity.usd) : 'curve'}</b></div>
      <div><span class="label">Age</span><b>${hrs == null ? '—' : hrs < 48 ? Math.round(hrs) + 'h' : Math.round(hrs / 24) + 'd'}</b></div>
    </div>
  </div>`;
}

function render(a, b) {
  const winA = a.score.value < b.score.value, winB = b.score.value < a.score.value;
  const groups = GROUPS.map(([id, title], i) => {
    const side = r => r.checks.filter(c => c.group === id);
    const ca = side(a), cb = side(b);
    const pa = ca.reduce((s, c) => s + RANK[c.status], 0), pb = cb.reduce((s, c) => s + RANK[c.status], 0);
    const better = pa === pb ? 'Even' : `<b>${esc(pa < pb ? (a.token.symbol || 'A') : (b.token.symbol || 'B'))}</b> looks cleaner`;
    const list = cs => cs.length ? cs.map(c => `<div class="row"><i class="dot ${c.status}"></i><div>${esc(c.title)}${c.detail ? `<small>${esc(c.detail)}</small>` : ''}</div></div>`).join('') : '<div class="none">No findings</div>';
    return `<div class="grp" style="--d:${0.15 + i * 0.06}s"><div class="grp-h"><span class="label">${title}</span><span class="who">${better}</span></div>
      <div class="grp-b"><div>${list(ca)}</div><div>${list(cb)}</div></div></div>`;
  }).join('');
  $('out').innerHTML = `<div class="cols">${card(a, winA, 0)}${card(b, winB, 1)}</div>
    <h2>Check by <em>check.</em></h2>${groups}
    <div class="share"><button type="button" id="copy">Copy comparison link</button><a href="/t/${a.token.address}">${esc(a.token.symbol || 'A')} report</a><a href="/t/${b.token.address}">${esc(b.token.symbol || 'B')} report</a></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $('out').querySelectorAll('.meter i').forEach(i => { i.style.width = i.dataset.w + '%'; });
    $('out').querySelectorAll('[data-to]').forEach(el => {
      const to = +el.dataset.to, t0 = performance.now();
      const step = now => { const p = Math.min((now - t0) / 1000, 1); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }));
  $('copy').onclick = e => navigator.clipboard?.writeText(location.href).then(() => { e.target.textContent = 'Copied'; });
}

const qs = new URLSearchParams(location.search);
if (qs.get('a') && qs.get('b')) { $('a').value = qs.get('a'); $('b').value = qs.get('b'); run(qs.get('a'), qs.get('b')); }
</script>
</body>
</html>
