<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launches today — Tell</title>
<meta name="description" content="Every new Pons launch on Robinhood Chain in the last 24 hours, checked and scored by Tell.">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/assets/tell.js"></script>
<style>
:root {
  --ink: #0b0b0c; --ink-2: #121213; --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.14);
  --text: #ece9e2; --muted: #9a958d; --dim: #5f5b55; --red: #8e0c14; --red-deep: #5c070c;
  --green: #4fb27a; --amber: #e3a540; --bad: #ff5a5f; --mid: #d8c24a;
  --serif: 'Instrument Serif', 'Times New Roman', serif;
  --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ink); }
body { background: var(--ink); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 768px) { .wrap { padding: 0 40px; } }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* hero band */
.band { position: relative; overflow: hidden; padding: 0 0 48px;
  background: radial-gradient(70% 140% at 85% 0%, rgba(255,40,40,0.22), transparent 60%), linear-gradient(120deg, var(--red-deep), var(--red) 60%, #7a0a12); }
.band::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .2; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.band > * { position: relative; z-index: 1; }
.band .ghost { position: absolute; right: -2%; top: -30%; height: 170%; opacity: .22; z-index: 0; mix-blend-mode: screen; pointer-events: none; }
nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 12px; }
.brand { font-family: var(--serif); font-size: 22px; letter-spacing: .32em; display: inline-flex; align-items: center; gap: 12px; color: #fff; }
.logo { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.links { display: none; gap: 26px; font-size: 13px; color: rgba(255,255,255,.85); }
.links a.on { color: #fff; text-decoration: underline; text-underline-offset: 6px; }
@media (min-width: 900px) { .links { display: flex; } }
.band h1 { font-family: var(--serif); font-weight: 400; font-size: 56px; line-height: .95; color: #fff; margin-top: 18px; }
@media (min-width: 768px) { .band h1 { font-size: 88px; } }
.live { display: inline-flex; align-items: center; gap: 8px; color: rgba(255,255,255,.8); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 0 rgba(255,255,255,.7); animation: live 1.6s infinite; }
@keyframes live { 70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
.stats { display: flex; gap: 40px; flex-wrap: wrap; margin-top: 36px; }
.stat b { display: block; font-family: var(--serif); font-weight: 400; font-size: 40px; color: #fff; line-height: 1; }
.stat .label { color: rgba(255,255,255,.7); margin-top: 6px; display: block; font-size: 10px; }

/* toolbar */
.bar { position: sticky; top: 0; z-index: 10; background: rgba(11,11,12,.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; }
.tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line-2); border-radius: 9999px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 9999px; font-size: 13px; cursor: pointer; color: var(--muted); transition: background .2s, color .2s; }
.tabs button.on { background: var(--text); color: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line-2); border-radius: 9999px; padding: 6px 11px; background: none; cursor: pointer; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; transition: color .2s, border-color .2s; }
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.chip.on { color: var(--text); border-color: var(--muted); }
.search { margin-left: auto; min-width: 200px; flex: 0 1 280px; background: var(--ink-2); border: 1px solid var(--line-2); color: var(--text); border-radius: 9999px; padding: 8px 14px; font: 12.5px var(--mono); outline: none; }
.search:focus { border-color: var(--muted); }
select.sort { background: var(--ink-2); color: var(--text); border: 1px solid var(--line-2); border-radius: 9999px; padding: 7px 12px; font: 12.5px var(--sans); }

/* rows */
.list { display: grid; gap: 8px; padding: 24px 0 80px; }
.row { display: grid; grid-template-columns: 44px 1.3fr 88px 2.4fr 120px 150px; gap: 16px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px;
  background: linear-gradient(90deg, rgba(255,255,255,0.015), transparent); transition: border-color .25s, background .25s, transform .25s cubic-bezier(.2,.7,.2,1); }
.row.anim { animation: row-in .55s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
@keyframes row-in { from { opacity: 0; transform: translateY(12px); } }
.row:hover { border-color: var(--line-2); background: linear-gradient(90deg, rgba(255,90,95,0.06), transparent 60%); transform: translateX(3px); }
.row.anim.fresh { animation: row-in .55s cubic-bezier(.2,.7,.2,1) both, glow 2.4s ease; }
@keyframes glow { 0%, 40% { box-shadow: 0 0 0 1px rgba(255,90,95,.6), 0 0 30px -8px rgba(255,90,95,.6); } }
@media (max-width: 960px) { .row { grid-template-columns: 40px 1fr 80px; } .row .verdict, .row .nums { display: none; } .row .acts { grid-column: 2 / -1; } }
.ava { position: relative; width: 40px; height: 40px; font-size: 40px; border-radius: 50%; overflow: hidden; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.row:hover .ava { transform: rotate(-6deg) scale(1.06); }
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.who b { display: block; font-weight: 500; }
.fake { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: #fff; background: var(--bad); border-radius: 4px; padding: 2px 6px; margin-left: 6px; vertical-align: middle; animation: fake-pulse 1.6s ease-in-out infinite; }
@keyframes fake-pulse { 50% { box-shadow: 0 0 0 4px rgba(255,90,95,.25); } }
.who span { font-size: 12px; color: var(--dim); }
.who .age { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: 6px; }
.score { display: grid; gap: 6px; }
.score b { font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: .9; }
.score .m { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.score .m i { display: block; height: 100%; border-radius: 3px; background: var(--c); width: 0; transition: width 1s cubic-bezier(.2,.7,.2,1); }
.t-ok { --c: var(--green); } .t-mid { --c: var(--mid); } .t-warn { --c: var(--amber); } .t-bad { --c: var(--bad); } .t-na { --c: var(--dim); }
.score small { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.checking { font-family: var(--mono); font-size: 10.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.check-btn { justify-self: start; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line-2); background: none; border-radius: 9999px; padding: 5px 12px; cursor: pointer; color: var(--text); transition: border-color .2s, background .2s; }
.check-btn:hover { border-color: var(--text); background: rgba(255,255,255,.05); }
.checking i { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.verdict { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nums { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: grid; gap: 2px; }
.nums span b { color: var(--text); font-weight: 400; }
.acts { display: flex; gap: 6px; justify-content: flex-end; }
.acts a, .acts button { border: 1px solid var(--line-2); border-radius: 9999px; padding: 6px 12px; font-size: 12px; background: none; cursor: pointer; white-space: nowrap; }
.acts a:hover, .acts button:hover { border-color: var(--text); }
.acts .primary { background: var(--text); color: var(--ink); border-color: var(--text); }
.delta { font-family: var(--mono); font-size: 11px; }
.delta.up { color: var(--bad); } .delta.down { color: var(--green); }
.empty { text-align: center; padding: 80px 0; color: var(--muted); }
.empty h3 { font-family: var(--serif); font-weight: 400; font-size: 40px; color: var(--text); }
.skel { height: 72px; border-radius: 14px; background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.06), rgba(255,255,255,0.02)); background-size: 200% 100%; animation: sk 1.4s infinite; }
@keyframes sk { to { background-position: -200% 0; } }
footer { padding: 32px 0 48px; border-top: 1px solid var(--line); font-size: 13px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="band">
  <img class="ghost" src="/assets/statue.webp" alt="">
  <nav>
    <div class="wrap">
      <a class="brand" href="/"><img class="logo" src="/assets/logo.webp" alt="" width="34" height="34">TELL</a>
      <div class="links">
        <a href="/">Check</a><a href="/launches" class="on">Launches</a><a href="/compare">Compare</a><a href="/app">Token map</a>
      </div>
      <div data-wallet></div>
    </div>
  </nav>
  <div class="wrap">
    <span class="label live"><i></i>Live · Pons launches · last 24 hours</span>
    <h1>Launches <em>today.</em></h1>
    <div class="stats">
      <div class="stat"><b id="s-total">—</b><span class="label">launched</span></div>
      <div class="stat"><b id="s-checked">—</b><span class="label">checked</span></div>
      <div class="stat"><b id="s-high">—</b><span class="label">high risk</span></div>
      <div class="stat"><b id="s-avg">—</b><span class="label">average score</span></div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="tabs" id="tabs"><button data-t="feed" class="on">Feed</button><button data-t="watch">Watchlist</button></div>
    <div class="chips" id="chips">
      <button class="chip on" data-r="all">All</button>
      <button class="chip" data-r="ok"><i style="background:var(--green)"></i>Low</button>
      <button class="chip" data-r="mid"><i style="background:var(--mid)"></i>Medium</button>
      <button class="chip" data-r="warn"><i style="background:var(--amber)"></i>Caution</button>
      <button class="chip" data-r="bad"><i style="background:var(--bad)"></i>High</button>
    </div>
    <select class="sort" id="sort" aria-label="Sort">
      <option value="new">Newest</option><option value="risk">Riskiest</option><option value="safe">Safest</option><option value="liq">Liquidity</option>
    </select>
    <input class="search" id="search" placeholder="Filter by name or 0x…" spellcheck="false">
  </div>
</div>

<main class="wrap">
  <div class="list" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<footer><div class="wrap" id="foot">Not financial advice.</div></footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const usd = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? '$' + (n / 1e3).toFixed(1) + 'k' : '$' + Math.round(n);
const tone = v => v == null ? 'na' : v >= 80 ? 'bad' : v >= 60 ? 'warn' : v >= 30 ? 'mid' : 'ok';
const ago = t => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 1 ? 'now' : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm'; };

const state = { tab: 'feed', risk: 'all', sort: 'new', q: '', feed: [], seen: new Set(), first: true,
  mode: 'live', total: 0, local: {}, busy: new Set(), tried: new Set(), running: false };

$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; state.tab = b.dataset.t; $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(true); };
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; state.risk = b.dataset.r; $('chips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); draw(true); };
$('sort').onchange = e => { state.sort = e.target.value; draw(true); };
$('search').oninput = e => { state.q = e.target.value.trim().toLowerCase(); draw(true); };

async function refresh() {
  try {
    const d = await (await fetch('/api/launches')).json();
    state.mode = d.mode || 'live';
    state.total = d.total || d.launches.length;
    // scores this browser fetched itself survive the refresh (serverless instances don't share a cache)
    state.feed = d.launches.map(l => (!l.score && state.local[l.token] ? { ...l, ...state.local[l.token] } : l));
    $('foot').textContent = state.mode === 'on-demand'
      ? 'Not financial advice. The newest launches are checked as you open this page; press Check on any other one.'
      : 'Not financial advice. Tell checks every new Pons launch in the background; fresh ones may still be in the queue.';
    stats();
    draw(false);
    if (state.mode === 'on-demand') autoCheck();
  } catch {}
}

/* On serverless there is no background checker: check the newest few unscored launches, one at a time. */
async function autoCheck() {
  if (state.running) return;
  state.running = true;
  try {
    for (let n = 0; n < 4; n++) {
      const next = state.feed.filter(l => !l.score && !state.tried.has(l.token)).sort((a, b) => b.at - a.at)[0];
      if (!next) break;
      await checkOne(next.token);
    }
  } finally { state.running = false; }
}

async function checkOne(token) {
  if (state.busy.has(token)) return;
  state.tried.add(token);
  state.busy.add(token);
  draw(false);
  try {
    const res = await fetch('/api/check?q=' + token);
    const r = await res.json();
    if (res.ok) {
      const pair = r.pairs?.[0];
      const got = { score: r.score, verdict: r.verdict, image: r.meta?.image || pair?.info?.imageUrl, holders: r.facts?.holders, liquidity: pair?.liquidity?.usd };
      state.local[token] = got;
      const l = state.feed.find(x => x.token === token);
      if (l) Object.assign(l, Object.fromEntries(Object.entries(got).filter(([, v]) => v != null)));
    }
  } catch {}
  state.busy.delete(token);
  stats();
  draw(false);
}

function stats() {
  const f = state.feed, checked = f.filter(l => l.score);
  const high = checked.filter(l => l.score.value >= 60).length;
  count($('s-total'), state.total || f.length);
  count($('s-checked'), checked.length);
  $('s-high').textContent = checked.length ? Math.round((high / checked.length) * 100) + '%' : '—';
  $('s-avg').textContent = checked.length ? Math.round(checked.reduce((s, l) => s + l.score.value, 0) / checked.length) : '—';
}
function count(el, to) {
  const from = +el.dataset.v || 0; el.dataset.v = to;
  const t0 = performance.now();
  const step = now => { const p = Math.min((now - t0) / 700, 1); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function rowsFor() {
  if (state.tab === 'watch') {
    return Tell.watch.list().map(w => {
      const live = state.feed.find(l => l.token === w.address.toLowerCase());
      return { token: w.address, symbol: w.symbol, name: w.name, at: w.at, score: live?.score ?? (w.current ? { value: w.current, label: '' } : null), saved: w.score, verdict: live?.verdict ?? w.verdict, image: live?.image ?? w.image, watch: true, liquidity: live?.liquidity, holders: live?.holders };
    });
  }
  return state.feed;
}

function draw(reset) {
  let rows = rowsFor();
  if (state.risk !== 'all') rows = rows.filter(l => l.score && tone(l.score.value) === state.risk);
  if (state.q) rows = rows.filter(l => [l.symbol, l.name, l.token].some(v => v && String(v).toLowerCase().includes(state.q)));
  const by = { new: (a, b) => b.at - a.at, risk: (a, b) => (b.score?.value ?? -1) - (a.score?.value ?? -1), safe: (a, b) => (a.score?.value ?? 999) - (b.score?.value ?? 999), liq: (a, b) => (b.liquidity ?? 0) - (a.liquidity ?? 0) }[state.sort];
  rows.sort(by);

  if (!rows.length) {
    $('list').innerHTML = state.tab === 'watch'
      ? '<div class="empty"><h3>Nothing <em>watched</em> yet.</h3><p>Press ☆ on any launch or report to keep an eye on it here.</p></div>'
      : state.feed.length ? '<div class="empty"><h3>No matches.</h3><p>Try another filter.</p></div>'
        : '<div class="empty"><h3>Listening for <em>launches.</em></h3><p>The first ones appear within a minute of the server starting.</p></div>';
    return;
  }
  $('list').innerHTML = rows.slice(0, 200).map((l, i) => {
    const t = tone(l.score?.value);
    const fresh = !state.first && !state.seen.has(l.token);
    const d = l.saved != null && l.score ? l.score.value - l.saved : null;
    const anim = reset || state.first || fresh;
    return `<div class="row t-${t}${anim ? ' anim' : ''}${fresh ? ' fresh' : ''}" style="--d:${reset || state.first ? Math.min(i, 12) * 0.035 : 0}s">
      <div class="ava">${Tell.avatar(l.token, l.symbol, l.image)}</div>
      <div class="who"><b>${esc(l.symbol ? '$' + l.symbol : short(l.token))}${l.impostor ? ' <i class="fake" title="Not the official $TELL. The only real address is published on tell.markets.">FAKE $TELL</i>' : ''}</b><span>${esc(l.name || '')}</span><span class="age">${l.watch ? 'added ' : ''}${ago(l.at)}</span></div>
      <div class="score">${l.score
        ? `<b>${l.score.value}</b><div class="m"><i data-w="${Math.max(l.score.value, 3)}"${anim ? '' : ` style="width:${Math.max(l.score.value, 3)}%;transition:none"`}></i></div><small>${esc(l.score.label)}${d ? ` <span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>` : ''}</small>`
        : l.checking || state.busy.has(l.token) ? '<span class="checking"><i></i>checking</span>'
          : state.mode === 'on-demand' ? `<button type="button" class="check-btn" data-check="${l.token}">Check</button>`
          : '<span class="checking"><i></i>queued</span>'}</div>
      <div class="verdict">${esc(l.verdict || 'Waiting for the check to finish.')}</div>
      <div class="nums">${l.liquidity ? `<span>liq <b>${usd(l.liquidity)}</b></span>` : '<span>on curve</span>'}${l.holders ? `<span><b>${l.holders}</b> holder${l.holders === 1 ? '' : 's'}</span>` : ''}</div>
      <div class="acts">
        <button type="button" data-watch="${l.token}" title="Watch">${Tell.watch.has(l.token) ? '★' : '☆'}</button>
        <a href="/app/${l.token}">Map</a><a class="primary" href="/t/${l.token}">Report</a>
      </div>
    </div>`;
  }).join('');
  rows.forEach(l => state.seen.add(l.token));
  state.first = false;
  requestAnimationFrame(() => requestAnimationFrame(() => $('list').querySelectorAll('.m i').forEach(i => { i.style.width = i.dataset.w + '%'; })));
  $('list').querySelectorAll('[data-check]').forEach(b => b.onclick = () => checkOne(b.dataset.check));
  $('list').querySelectorAll('[data-watch]').forEach(b => b.onclick = () => {
    const l = rowsFor().find(x => x.token.toLowerCase() === b.dataset.watch.toLowerCase());
    if (!l) return;
    Tell.watch.toggle({ token: { address: l.token, symbol: l.symbol, name: l.name }, score: { value: l.score?.value ?? 0 } });
    draw(false);
  });
}

refresh();
setInterval(refresh, 20000);
setInterval(() => draw(false), 60000); // keep the "Xm ago" labels moving
</script>
</body>
</html>
